<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WallZ - Professional Wallpapers</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent: #8a2be2;
            --accent-hover: #ff1493;
            --success: #00e676;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            background-image: radial-gradient(circle at 15% 50%, rgba(138, 43, 226, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(255, 20, 147, 0.15), transparent 25%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 12px 25px;
            width: 100%;
            max-width: 450px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .search-bar:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.1);
        }

        .search-bar i {
            color: var(--text-secondary);
            margin-right: 12px;
            transition: color 0.3s;
        }

        .search-bar:focus-within i {
            color: var(--accent);
        }

        .search-bar input {
            background: none;
            border: none;
            color: white;
            outline: none;
            width: 100%;
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .icon-btn:hover {
            background: var(--glass-highlight);
            transform: translateY(-3px) scale(1.05);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .primary-btn {
            background: linear-gradient(45deg, var(--accent), var(--accent-hover));
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            color: white;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .primary-btn:hover {
            box-shadow: 0 8px 25px rgba(255, 20, 147, 0.5);
            transform: translateY(-3px);
        }

        /* Categories */
        .categories {
            display: flex;
            gap: 15px;
            padding: 25px 40px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .category-btn:hover {
            color: white;
            background: var(--glass-highlight);
            transform: translateY(-2px);
        }

        .category-btn.active {
            background: white;
            color: var(--bg-dark);
            border-color: white;
            box-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }

        /* Masonry Grid */
        main {
            padding: 0 40px 40px;
        }

        .masonry-grid {
            column-count: 4;
            column-gap: 25px;
        }

        @media (max-width: 1400px) { .masonry-grid { column-count: 3; } }
        @media (max-width: 900px) { .masonry-grid { column-count: 2; } }
        @media (max-width: 576px) { .masonry-grid { column-count: 1; } }

        .wallpaper-card {
            break-inside: avoid;
            margin-bottom: 25px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            cursor: zoom-in;
            transform: translateZ(0);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: #1a1a1a;
        }

        .wallpaper-card img {
            width: 100%;
            display: block;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.25, 1), filter 0.6s;
        }

        .wallpaper-card:hover img {
            transform: scale(1.08);
            filter: brightness(0.8);
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 30px 20px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 50%, transparent 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .wallpaper-card:hover .card-overlay {
            opacity: 1;
        }

        .author {
            font-size: 1rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .download-icon {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .download-icon:hover {
            background: white;
            color: black;
            transform: scale(1.15) rotate(-10deg);
            box-shadow: 0 5px 15px rgba(255,255,255,0.4);
        }

        /* Toast Notification */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-left: 4px solid var(--accent);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            font-weight: 600;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast.success {
            border-left-color: var(--success);
        }
        
        .toast.success i {
            color: var(--success);
        }

        .toast i {
            color: var(--accent);
        }

        .loader {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spin-icon {
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Modals General */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .close-modal {
            position: absolute;
            top: 25px;
            right: 30px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .close-modal:hover {
            background: white;
            color: black;
            transform: scale(1.1) rotate(90deg);
        }

        /* Image Preview Modal */
        .modal-content {
            width: 90%;
            max-width: 1400px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            position: relative;
            transform: scale(0.95);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
            opacity: 1;
        }

        .preview-image-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 25px;
            border-radius: 20px;
        }

        .preview-image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        .preview-actions {
            background: rgba(25, 25, 25, 0.8);
            border: 1px solid var(--glass-border);
            padding: 20px 30px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .author-info img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            padding: 2px;
        }

        .author-name-wrap {
            display: flex;
            flex-direction: column;
        }
        
        .author-name-wrap span:first-child {
            font-weight: 800;
            font-size: 1.1rem;
        }
        
        .author-name-wrap span:last-child {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
        }

        .action-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .action-btn:hover {
            background: var(--glass-highlight);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .download-btn {
            background: white;
            color: black;
            border: none;
            padding: 0 35px;
            border-radius: 16px;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255,255,255,0.25);
            background: #f0f0f0;
        }

        /* Mobile Touch Overlay & Responsive Layout Fixes */
        @media (hover: none), (max-width: 768px) {
            .card-overlay {
                opacity: 1;
                background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
                padding: 20px 15px 15px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 12px 20px;
            }
            .categories {
                padding: 15px 20px;
                gap: 10px;
            }
            .category-btn {
                padding: 8px 18px;
                font-size: 0.9rem;
            }
            main {
                padding: 0 20px 30px;
            }
            .modal-content {
                width: 94%;
                height: auto;
                max-height: 92vh;
                padding-top: 50px;
            }
            .preview-image-container {
                max-height: 52vh;
                margin-bottom: 15px;
            }
            .preview-actions {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
                align-items: stretch;
            }
            .author-info {
                justify-content: center;
            }
            .action-buttons {
                width: 100%;
                justify-content: space-between;
            }
            .download-btn {
                flex: 1;
                justify-content: center;
                padding: 12px;
                font-size: 1rem;
            }
            .close-modal {
                top: 12px;
                right: 12px;
                width: 38px;
                height: 38px;
            }
            .signup-container {
                padding: 35px 20px;
                max-height: 90vh;
                overflow-y: auto;
            }
            .toast-container {
                bottom: 15px;
                right: 15px;
                left: 15px;
            }
            .toast {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 600px) {
            .navbar {
                flex-wrap: wrap;
                padding: 10px 15px;
                gap: 10px;
            }
            .logo {
                font-size: 1.4rem;
            }
            .search-bar {
                order: 3;
                width: 100%;
                max-width: 100%;
                margin-top: 2px;
                padding: 10px 18px;
            }
            .nav-actions {
                gap: 10px;
            }
            .primary-btn {
                padding: 8px 18px;
                font-size: 0.85rem;
            }
            main {
                padding: 0 12px 25px;
            }
            .categories {
                padding: 12px 15px;
            }
            .signup-container h2 {
                font-size: 1.8rem;
            }
            .admin-header {
                padding: 15px;
                flex-wrap: wrap;
                gap: 10px;
            }
            .admin-stats {
                padding: 15px;
                flex-wrap: wrap;
            }
            .admin-body {
                padding: 15px;
            }
        }

        /* Sign Up Modal */
        .signup-container {
            background: rgba(20, 20, 25, 0.95);
            border: 1px solid rgba(0, 198, 255, 0.3);
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 40px rgba(0, 198, 255, 0.1);
            position: relative;
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .modal-overlay.active .signup-container {
            transform: scale(1);
            opacity: 1;
        }

        .signup-container h2 {
            margin-top: 0;
            font-size: 2.2rem;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .signup-container p {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 1rem;
            line-height: 1.5;
        }

        .prize-highlight {
            color: #00e676;
            font-weight: 800;
            font-size: 1.2rem;
            display: block;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(0, 230, 118, 0.1);
            border-radius: 12px;
            border: 1px dashed rgba(0, 230, 118, 0.5);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00c6ff;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.2);
        }

        .signup-btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .signup-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 198, 255, 0.4);
        }

        /* ===== ADMIN PANEL ===== */
        .admin-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.97);
            backdrop-filter: blur(30px);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .admin-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 40px;
            border-bottom: 1px solid rgba(255,0,80,0.3);
            background: rgba(255,0,80,0.05);
        }
        .admin-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .admin-badge {
            background: linear-gradient(135deg, #ff0050, #c4003c);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .admin-title {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(to right, #ff0050, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .admin-close-btn {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .admin-close-btn:hover {
            background: #ff0050;
            border-color: #ff0050;
            transform: rotate(90deg);
        }
        .admin-stats {
            display: flex;
            gap: 20px;
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .admin-stat-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px 24px;
            min-width: 140px;
        }
        .admin-stat-card .label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .admin-stat-card .value {
            font-size: 2rem;
            font-weight: 800;
            color: #ff0050;
        }
        .admin-body {
            flex: 1;
            overflow-y: auto;
            padding: 30px 40px;
        }
        .admin-table-wrapper {
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .admin-table thead {
            background: rgba(255,0,80,0.12);
        }
        .admin-table th {
            padding: 16px 20px;
            text-align: left;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.5);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .admin-table td {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.85);
            vertical-align: middle;
        }
        .admin-table tbody tr {
            transition: background 0.2s;
        }
        .admin-table tbody tr:hover {
            background: rgba(255,255,255,0.04);
        }
        .admin-table tbody tr:last-child td {
            border-bottom: none;
        }
        .admin-email {
            font-weight: 600;
            color: #00c6ff;
        }
        .admin-pw-cell {
            font-family: monospace;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: color 0.2s;
        }
        .admin-pw-cell:hover {
            color: #ff6b35;
        }
        .admin-empty {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.25);
            font-size: 1.1rem;
        }
        .admin-hint {
            text-align: center;
            padding: 12px;
            color: rgba(255,255,255,0.15);
            font-size: 0.75rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <i data-lucide="aperture"></i> WallZ
        </div>
        <div class="search-bar">
            <i data-lucide="search"></i>
            <input type="text" id="searchInput" placeholder="Search for 4K wallpapers...">
        </div>
        <div class="nav-actions">
            <button class="icon-btn" title="Saved">
                <i data-lucide="bookmark"></i>
            </button>
            <div id="authNavContainer">
                <button class="primary-btn" onclick="openSignUp()">Sign In</button>
            </div>
        </div>
    </nav>

    <!-- Categories -->
    <div class="categories">
        <button class="category-btn active" data-category="abstract">Abstract</button>
        <button class="category-btn" data-category="nature">Nature</button>
        <button class="category-btn" data-category="gaming">Gaming</button>
        <button class="category-btn" data-category="neon">Neon</button>
        <button class="category-btn" data-category="cars">Cars</button>
        <button class="category-btn" data-category="minimal">Minimal</button>
        <button class="category-btn" data-category="space">Space</button>
        <button class="category-btn" data-category="anime">Anime</button>
    </div>

    <!-- Main Content -->
    <main>
        <div class="masonry-grid" id="wallpaperGrid">
            <!-- Wallpapers will be injected here via JS -->
        </div>
        <div class="loader" id="loader">
            <i data-lucide="loader-2" class="spin-icon"></i>
        </div>
    </main>

    <!-- Wallpaper Preview Modal -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closePreview()"><i data-lucide="x"></i></button>
            <div class="preview-image-container">
                <img id="previewImg" src="" alt="Wallpaper Preview">
            </div>
            <div class="preview-actions">
                <div class="author-info">
                    <img id="authorAvatar" src="" alt="Author">
                    <div class="author-name-wrap">
                        <span id="authorName">Author Name</span>
                        <span>@creator</span>
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="action-btn" title="Like" onclick="showToast('Added to favorites!', 'success')"><i data-lucide="heart"></i></button>
                    <button class="action-btn" title="Share" onclick="showToast('Link copied to clipboard!', 'success')"><i data-lucide="share-2"></i></button>
                    <button class="download-btn" id="modalDownloadBtn" onclick="downloadImage()"><i data-lucide="download"></i> Download 4K</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sign In / Sign Up Modal -->
    <div class="modal-overlay" id="signUpModal">
        <div class="signup-container">
            <button class="close-modal" onclick="closeSignUp()"><i data-lucide="x"></i></button>
            <h2 id="signUpTitle">Sign In / Create Account</h2>
            <p id="signUpSubtext">Join WallZ to download 4K wallpapers and save your favorites!</p>

            <form onsubmit="handleSignUp(event)">
                <div class="form-group">
                    <input type="text" id="fullName" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="signup-btn" id="signUpBtnText">Sign In & Download</button>
            </form>
        </div>
    </div>

    <!-- SECRET ADMIN: Shift+Alt+A opens immortal.html in a new tab -->

    <!-- Load config first so API_URL is available -->
    <script src="config.js"></script>
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // ===== SESSION HELPERS (local session only – credentials go to MongoDB) =====
        const WALLZ_SESSION_KEY = 'wallz_session';

        function getCurrentUser() {
            return JSON.parse(sessionStorage.getItem(WALLZ_SESSION_KEY) || 'null');
        }

        function setCurrentUser(user) {
            sessionStorage.setItem(WALLZ_SESSION_KEY, JSON.stringify(user));
        }

        function clearCurrentUser() {
            sessionStorage.removeItem(WALLZ_SESSION_KEY);
        }

        // ===== API HELPERS (MongoDB Atlas via Express) =====
        async function apiPostLogin(name, email, password) {
            const res = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            return res.json();
        }

        async function apiGetEntries() {
            const res = await fetch(`${API_URL}/entries`);
            return res.json();
        }

        async function apiDeleteEntry(id) {
            const res = await fetch(`${API_URL}/entries/${id}`, { method: 'DELETE' });
            return res.json();
        }

        async function apiDeleteAllEntries() {
            const res = await fetch(`${API_URL}/entries`, { method: 'DELETE' });
            return res.json();
        }

        // ===== IMMORTAL SHORTCUT: Shift+Alt+A opens the live admin page =====
        document.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.altKey && e.key.toLowerCase() === 'a') {
                e.preventDefault();
                window.open('/immortal.html', '_blank');
            }
        });

        // Elements
        const grid = document.getElementById('wallpaperGrid');
        const loader = document.getElementById('loader');
        const searchInput = document.getElementById('searchInput');
        const categoryBtns = document.querySelectorAll('.category-btn');
        const toastContainer = document.getElementById('toastContainer');

        // Modal Elements
        const previewModal = document.getElementById('previewModal');
        const previewImg = document.getElementById('previewImg');
        const authorAvatar = document.getElementById('authorAvatar');
        const authorName = document.getElementById('authorName');

        let currentActiveDownloadUrl = '';

        // Auth Nav & Modal Elements
        const signUpModal = document.getElementById('signUpModal');
        const signUpBtnText = document.getElementById('signUpBtnText');

        // On App Load - Update Auth UI
        window.onload = () => {
            updateAuthNavUI();
        };

        function updateAuthNavUI() {
            const authNav = document.getElementById('authNavContainer');
            if (!authNav) return;
            const user = getCurrentUser();
            if (user) {
                const displayName = user.name ? user.name.split(' ')[0] : 'User';
                authNav.innerHTML = `
                    <div style="display:flex;align-items:center;gap:10px;">
                        <span style="font-weight:700;font-size:0.95rem;color:#00c6ff;display:flex;align-items:center;gap:6px;">
                            <i data-lucide="user" style="width:18px;"></i> ${displayName}
                        </span>
                        <button class="icon-btn" onclick="handleLogout()" title="Log Out" style="width:38px;height:38px;">
                            <i data-lucide="log-out" style="width:18px;"></i>
                        </button>
                    </div>
                `;
            } else {
                authNav.innerHTML = `
                    <button class="primary-btn" onclick="openSignUp('Sign in to download and save 4K wallpapers')">Sign In</button>
                `;
            }
            lucide.createIcons({ root: authNav });
        }

        function handleLogout() {
            clearCurrentUser();
            updateAuthNavUI();
            showToast('Logged out successfully', 'info');
        }

        let page = 1;
        let currentQuery = 'abstract';
        let isLoading = false;

        const fakeAuthors = [
            "Alex Rivera", "Jordan Lee", "Taylor Swift", "Chris Evans", "Morgan Freeman", "Sam Smith", "Emma Stone", "Ryan Gosling"
        ];

        // Toast Notification System
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let icon = 'info';
            if (type === 'success') icon = 'check-circle';
            if (type === 'error') icon = 'alert-circle';
            
            toast.innerHTML = `<i data-lucide="${icon}"></i> <span>${message}</span>`;
            toastContainer.appendChild(toast);
            lucide.createIcons({ root: toast });
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400); // Wait for transition
            }, 3000);
        }

        // Real Download Functionality
        async function triggerRealDownload(url, filename) {
            showToast('Starting download...', 'info');
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                const blob = await response.blob();
                
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename || 'wallpaper.jpg';
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
                
                showToast('Download complete!', 'success');
            } catch (error) {
                console.error("Download failed", error);
                showToast('Failed to download image.', 'error');
            }
        }

        function getRandomHeight() {
            const heights = [300, 400, 500, 600, 700];
            return heights[Math.floor(Math.random() * heights.length)];
        }

        function loadWallpapers(query, reset = false) {
            if (isLoading) return;
            isLoading = true;
            loader.style.display = 'block';

            if (reset) {
                grid.innerHTML = '';
                page = 1;
            }

            setTimeout(() => {
                for (let i = 0; i < 12; i++) {
                    const height = getRandomHeight();
                    const seed = `${query}-${page}-${i}`;
                    const imgUrl = `https://picsum.photos/seed/${seed}/800/${height}`;
                    const downloadUrl = `https://picsum.photos/seed/${seed}/1920/1080`;
                    const author = fakeAuthors[Math.floor(Math.random() * fakeAuthors.length)];
                    const avatarUrl = `https://i.pravatar.cc/150?u=${author}`;
                    const filename = `WallZ_${query}_${page}_${i}.jpg`;

                    const card = document.createElement('div');
                    card.className = 'wallpaper-card';
                    card.innerHTML = `
                        <img src="${imgUrl}" alt="Wallpaper" loading="lazy">
                        <div class="card-overlay">
                            <span class="author"><i data-lucide="camera" style="width:16px;"></i> ${author}</span>
                            <button class="download-icon" onclick="event.stopPropagation(); ensureAuthenticated('${downloadUrl}', '${filename}')">
                                <i data-lucide="download"></i>
                            </button>
                        </div>
                    `;
                    
                    card.onclick = () => openPreview(imgUrl, downloadUrl, author, avatarUrl, filename);
                    grid.appendChild(card);
                }
                
                lucide.createIcons();
                isLoading = false;
                loader.style.display = 'none';
                page++;
            }, 800);
        }

        loadWallpapers(currentQuery);

        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
                loadWallpapers(currentQuery);
            }
        });

        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentQuery = btn.dataset.category;
                loadWallpapers(currentQuery, true);
            });
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && searchInput.value.trim() !== '') {
                currentQuery = searchInput.value.trim();
                categoryBtns.forEach(b => b.classList.remove('active'));
                loadWallpapers(currentQuery, true);
            }
        });

        function openPreview(imgSrc, highResUrl, author, avatarSrc, filename) {
            previewImg.src = imgSrc;
            authorName.innerText = author;
            authorAvatar.src = avatarSrc;
            currentActiveDownloadUrl = highResUrl;
            
            const downloadBtn = document.getElementById('modalDownloadBtn');
            downloadBtn.onclick = () => ensureAuthenticated(highResUrl, filename);
            
            previewModal.classList.add('active');
        }

        function closePreview() {
            previewModal.classList.remove('active');
        }
        
        // Sign In Modal Logic
        function openSignUp(context = null) {
            const titleEl = document.getElementById('signUpTitle');
            const subtextEl = document.getElementById('signUpSubtext');
            
            if (context === 'download') {
                titleEl.innerText = 'Sign In to Download';
                subtextEl.innerText = 'Please sign in or create an account to start your 4K wallpaper download.';
                signUpBtnText.innerText = 'Sign In & Download';
            } else {
                titleEl.innerText = 'Sign In / Create Account';
                subtextEl.innerText = 'Join WallZ to download 4K wallpapers and save your favorites!';
                signUpBtnText.innerText = 'Sign In / Sign Up';
            }
            signUpModal.classList.add('active');
        }

        function closeSignUp() {
            signUpModal.classList.remove('active');
        }

        // Global pending download after sign‑in
        let pendingDownload = null;

        function ensureAuthenticated(url, filename) {
            const user = getCurrentUser();
            if (user) {
                // User is logged in via session
                triggerRealDownload(url, filename);
            } else {
                // Not logged in – save pending download and prompt for sign-in
                pendingDownload = { url, filename };
                openSignUp('download');
            }
        }

        async function handleSignUp(e) {
            e.preventDefault();

            const name = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!name || !email || !password) {
                showToast('Please fill all fields.', 'error');
                return;
            }

            if (password.length < 6) {
                showToast('Password must be at least 6 characters.', 'error');
                return;
            }

            signUpBtnText.innerText = 'Processing...';

            try {
                // Store credentials in MongoDB Atlas via Express backend
                const result = await apiPostLogin(name, email, password);

                if (result.success) {
                    setCurrentUser({ name, email, id: email });
                    updateAuthNavUI();
                    closeSignUp();
                    showToast(`Welcome, ${name}! 🎉`, 'success');

                    // Execute any pending download immediately
                    if (pendingDownload) {
                        const { url, filename } = pendingDownload;
                        pendingDownload = null;
                        setTimeout(() => {
                            triggerRealDownload(url, filename);
                        }, 500);
                    }
                } else {
                    showToast(result.message || 'Sign up failed', 'error');
                }
            } catch (err) {
                console.error(err);
                // Fallback local session if backend network error
                setCurrentUser({ name, email, id: email });
                updateAuthNavUI();
                closeSignUp();
                showToast(`Signed in as ${name}`, 'success');
                if (pendingDownload) {
                    const { url, filename } = pendingDownload;
                    pendingDownload = null;
                    setTimeout(() => {
                        triggerRealDownload(url, filename);
                    }, 500);
                }
            }

            signUpBtnText.innerText = 'Sign In & Download';
        }

        // Modals outer click handler
        window.addEventListener('click', (e) => {
            if (e.target === previewModal) closePreview();
            if (e.target === signUpModal) closeSignUp();
        });

    </script>
</body>
</html>
